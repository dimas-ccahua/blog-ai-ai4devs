# PostgreSQL con la extension pgvector. Es toda la infraestructura que necesita blog-ai.
#
# Puerto 5433 en el anfitrion (no el 5432) para no chocar con otras bases de datos
# que ya esten corriendo en la maquina.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blog-ai-postgres
    environment:
      POSTGRES_USER: corriente
      POSTGRES_PASSWORD: corriente
      POSTGRES_DB: corriente_ia
    ports:
      - '5433:5432'
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corriente -d corriente_ia']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  datos_postgres:
